[package]
name = "whetstone"
version = "0.12.0"
edition = "2021"
description = "Whetstone sharpens the tools that write your code"
license = "MIT"
rust-version = "1.75"
default-run = "whetstone"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
tree-sitter = "0.22"
tree-sitter-python = "0.21"
tree-sitter-rust = "0.21"
tree-sitter-typescript = "0.21"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1

[lints.clippy]
unwrap_used = "deny"
