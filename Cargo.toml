[package]
name = "whetstone"
version = "0.15.0"
edition = "2021"
description = "A repository's rulebook: enforced rules with a rationale and an agent protocol"
license = "MIT"
rust-version = "1.75"
default-run = "whetstone"
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/assets/**",
    "/src/**",
    "/references/**",
]

[dependencies]
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tree-sitter = "0.22"
tree-sitter-python = "0.21"
tree-sitter-rust = "0.21"
tree-sitter-typescript = "0.21"
walkdir = "2"
serde_path_to_error = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1

[lints.clippy]
unwrap_used = "deny"
