[package]
name = "whetstone"
version = "0.12.0"
edition = "2021"
description = "Whetstone sharpens the tools that write your code"
license = "MIT"
rust-version = "1.75"
default-run = "whetstone"
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/SKILL.md",
    "/assets/dashboard/**",
    "/src/**",
    "/references/agreement-record-v1.schema.json",
    "/references/command-response-v1.schema.json",
    "/references/repair-host-transport.md",
    "/references/rule-schema.yaml",
    "/references/signal-strategies.md",
    "/planning/skill-cli-boundary.md",
    "/tests/domain_fixtures.rs",
    "/tests/fixtures/direction_cases.json",
    "/tests/kernel_cli.rs",
    "/tests/repair_host.rs",
    "/tests/repair_transport_cli.rs",
    "/tests/storage_atomic_dolt.rs",
    "/tests/storage_dolt.rs",
    "/examples/whetstone-client.sh",
    "/examples/whetstone_client.py",
]

[dependencies]
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
toml = "0.8"
tree-sitter = "0.22"
tree-sitter-python = "0.21"
tree-sitter-rust = "0.21"
tree-sitter-typescript = "0.21"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1

[lints.clippy]
unwrap_used = "deny"
