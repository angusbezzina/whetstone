# Temporary R0 rule input schema.
#
# Existing data is preserved while Direction 05's typed record model is built.
# New code must not treat this file as authenticated acceptance or activation.

source:
  name: string
  docs_url: string
  version: string
  content_hash: string
  resolved_at: string
  registry: enum # pypi | npm | crates_io | manual
  content_origin: string

rules:
  - id: string
    severity: enum # must | should | may
    confidence: enum # high | medium
    category: enum # migration | default | convention | breaking-change | semantic
    description: string
    source_url: string
    source_quote: string
    approved: boolean
    status: enum # candidate | approved
    languages: [string]

    signals:
      - id: string
        strategy: enum # ast | lint_proxy; pattern is legacy and not executable
        description: string
        weight: enum # required | strong | moderate
        ast_query: string # required for ast; every @match capture is a violation
        lint:
          tool: enum # ruff | biome | clippy
          code: string

    formatter:
      tool: enum # ruff | biome | rustfmt
      options: map

    tests:
      - runner: enum # pytest | vitest | cargo
        path: string # repository-relative
        selector: string

    validators:
      - adapter: enum # command | lint_rule | linked_test
        rule: string
        mode: enum # enforce | monitor
        config: map

    provenance:
      source_page_id: string
      source_page_path: string
      source_authority: string
      source_line_start: integer
      source_line_end: integer
      upstream_urls: [string]

    golden_examples:
      - code: string
        verdict: enum # pass | fail
        reason: string
        language: string

    deterministic_pass_threshold: integer
    deterministic_fail_threshold: integer
