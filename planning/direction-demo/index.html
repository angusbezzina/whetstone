/* ---------- theme ---------- */
function setTheme(mode){
  const root = document.documentElement;
  if (mode==="light"||mode==="dark") root.setAttribute("data-theme", mode); else root.removeAttribute("data-theme");
  try { if (mode==="system") localStorage.removeItem("wh-theme"); else localStorage.setItem("wh-theme", mode); } catch {}
  document.querySelectorAll(".theme button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.theme===mode)));
}
document.querySelectorAll(".theme button").forEach(b=>b.addEventListener("click",()=>{ setTheme(b.dataset.theme); announce(`${b.dataset.theme} theme`); }));
setTheme((()=>{ try { const t = localStorage.getItem("wh-theme"); return t==="light"||t==="dark" ? t : "system"; } catch { return "system"; } })());

/* ---------- derived ---------- */
function drafts(){ return [data.mission,...data.values,...data.metrics,...data.rules,...data.gates].filter(r=>r.state==="draft"||r.draft).length; }
function attention(){
  const items = [];
  for (const g of data.gates) if (g.run?.result==="fail") items.push({ kind:"agent repair", tone:"fail", title:`${g.name} is failing`, text:`${g.run.failures.length} failure${g.run.failures.length===1?"":"s"} in the current check of ${g.scope}. The worker that made the change repairs it within task scope, then runs the exact check again.`, actor:"your coding agent", route:"checks", focus:g.id, action:"Open the failing gate", next:"Hand the brief to the agent; return here when it has rerun the check." });
  for (const m of data.metrics) if (m.obs==="not_observed") items.push({ kind:"outcome not observed", tone:"warn", title:`${m.name} has no observation`, text:`Target ${m.threshold} over ${m.window}; source ${m.source}. Without an observation the mission's success is unknown, not fine.`, actor:"metric owner", route:"foundations", focus:m.id, action:"Open the metric", next:"Connect the source or revise the definition through review." });
  for (const g of data.gates) if (g.run && g.run.result==="pass" && !g.run.fresh) items.push({ kind:"stale result", tone:"warn", title:`${g.name} passed before the latest change`, text:"The last pass predates edits in its scope. A stale pass is not a current pass.", actor:"you or your agent", route:"checks", focus:g.id, action:"Open checks", next:"Run the check again on the current revision." });
  const d = drafts(); if (d) items.push({ kind:"review", tone:"muted", title:`${d} local draft${d===1?"":"s"} await${d===1?"s":""} your review`, text:"Drafts are private and inactive until you accept them. Nothing has been shared or installed.", actor:"project owner", route:"changelog", action:"Open the changelog", next:"Accept, revise, or withdraw each draft." });
  return items;
}
function metricState(m){ return m.obs==="not_observed" ? ["warn","not observed"] : m.obs==="off_target" ? ["fail",`${m.latest} · off target`] : ["pass",`${m.latest} · on target`]; }
function gateState(g){
  if (g.state==="draft") return ["draft","draft · not run"];
  if (!g.run) return ["warn","not run"];
  if (g.run.result==="fail") return ["fail",`fail · ${g.run.failures.length}`];
  return g.run.fresh ? ["pass","pass"] : ["warn","pass · stale"];
}

function findRec(id){ return [data.mission,...data.values,...data.metrics,...data.rules,...data.gates].find(r=>r.id===id); }
function openEditor(id, trigger){
  document.querySelectorAll(".editor.open").forEach(e=>{ e.classList.remove("open"); e.firstElementChild.innerHTML=""; });
  document.querySelectorAll("[data-edit][aria-expanded=true]").forEach(b=>b.setAttribute("aria-expanded","false"));
  const rec = findRec(id); const host = document.querySelector(`[data-editor="${CSS.escape(id)}"]`); if(!rec||!host) return;
  const current = rec.draft ? rec.draft.content : (rec.content||rec.name);
  host.firstElementChild.innerHTML = `
    <form data-form="${esc(id)}">
      <div class="base"><span>base <b>v${rec.draft?rec.draft.rev:rec.rev}</b> · ${rec.draft?"draft":rec.state} · ${esc(data.agreement.owner)} owns this record</span><span>draft stays private</span></div>
      <label>${rec.name?"Name":"Content"}<textarea name="content" required>${esc(current)}</textarea></label>
      ${rec.threshold?`<div class="two"><label>Target<input name="threshold" value="${esc(rec.threshold)}"></label><label>Window<input name="window" value="${esc(rec.window)}"></label></div>`:""}
      ${rec.ref?`<div class="two"><label>Mechanism<select name="mech">${["test","validator","formatter","lint_proxy","ast"].map(k=>`<option value="${k}" ${k===rec.mech?"selected":""}>${k.replace("_"," ")}</option>`).join("")}</select></label><label>Command or query<input name="ref" value="${esc(rec.ref)}"></label></div>`:""}
      <div class="two"><label>Why is this changing?<input name="rationale" required placeholder="The reason a reviewer will read"></label><label>Expected effect<input name="effect" required placeholder="What should be different afterwards"></label></div>
      <div class="act"><button class="btn" type="button" data-cancel>Cancel</button><button class="btn primary" type="submit">Review draft</button></div>
    </form>`;
  host.classList.add("open"); trigger?.setAttribute("aria-expanded","true");
  host.querySelector("textarea").focus();
  host.querySelector("[data-cancel]").addEventListener("click",()=>{ closeEditor(host); trigger?.focus(); announce("Edit cancelled; nothing changed."); });
  host.querySelector("form").addEventListener("submit",e=>{
    e.preventDefault(); const f=new FormData(e.currentTarget); const after=String(f.get("content")).trim(); const rationale=String(f.get("rationale")).trim(); const effect=String(f.get("effect")).trim();
    host.firstElementChild.innerHTML = `
      <div class="review" role="group" aria-label="Review draft">
        <div class="base"><span>exact records on confirm · base <b>v${rec.draft?rec.draft.rev:rec.rev}</b> → draft <b>v${(rec.draft?rec.draft.rev:rec.rev)+1}</b></span></div>
        <div class="diff"><div class="before"><div class="lab">before · v${rec.draft?rec.draft.rev:rec.rev}</div>${esc(current)}</div><div class="after"><div class="lab">after · v${(rec.draft?rec.draft.rev:rec.rev)+1} draft</div>${esc(after)}</div></div>
        <div class="why"><span class="k">why</span> ${esc(rationale)} &nbsp;·&nbsp; <span class="k">expected</span> ${esc(effect)}</div>
        <div class="effects"><span class="y">private draft <b>written</b></span><span class="n">shared <b>no</b></span><span class="n">accepted <b>no</b></span><span class="n">activated <b>no</b></span><span class="n">installed <b>no</b></span><span class="n">checked <b>no</b></span></div>
        <div class="confirm"><span class="note">Recording a draft never shares, accepts, installs or passes it.</span><button class="btn" type="button" data-back>Back</button><button class="btn primary" type="button" data-confirm>Record local draft</button></div>
      </div>`;
    host.querySelector("[data-confirm]").focus();
    host.querySelector("[data-back]").addEventListener("click",()=>openEditor(id,trigger));
    host.querySelector("[data-confirm]").addEventListener("click",()=>{
      const before = current; const nextRev = (rec.draft?rec.draft.rev:rec.rev)+1; if (rec.state==="draft"){ rec.rev=nextRev; if(rec.name) rec.name=after; else rec.content=after; } else { rec.draft = { rev:nextRev, content:after }; }
      data.changes.unshift({ id:"c"+Date.now(), at:NOW.toISOString(), title:`${rec.ref?"Gate":rec.threshold?"Metric":rec.kind?"Guideline":rec.outcomes?"Mission":"Core value"} revised: ${after}`, ver:`v${nextRev-1} → v${nextRev}`, status:"draft", owner:data.agreement.owner, area: rec.ref?"gates":rec.threshold?"metrics":rec.kind?"rules":id.startsWith("value")?"values":"mission", summary:rationale+" Expected: "+effect, before:{content:before}, after:{content:after} });
      renderAll(); announce(`Local draft v${nextRev} recorded. It is private and inactive until accepted; the accepted record stays in force.`);
      document.querySelector(`[data-rec="${CSS.escape(id)}"] [data-edit]`)?.focus();
    });
  });
}
function closeEditor(host){ host.classList.remove("open"); host.firstElementChild.innerHTML=""; host.closest(".rec")?.querySelector("[data-edit]")?.setAttribute("aria-expanded","false"); }

function renderChecks(){
  const el = $("checks");
  if (demo==="fresh"){ el.innerHTML = `<div class="viewhead"><h1>Checks</h1><p class="sub">Available once a gate exists. Establish the foundations first.</p></div><div class="panel"><div class="empty">No gates to run. <code class="cmd">wh check</code> would report unknown, not pass.</div></div>`; return; }
  const eligible = data.gates.filter(g=>g.state!=="draft");
  const tally = { pass:eligible.filter(g=>g.run?.result==="pass"&&g.run.fresh).length, fail:eligible.filter(g=>g.run?.result==="fail").length, warn:eligible.filter(g=>!g.run||(g.run.result==="pass"&&!g.run.fresh)).length };
  el.innerHTML = `
    <div class="viewhead"><h1>Checks</h1><p class="sub">What ran, what failed, and the exact route back to green. Definitions live in Foundations.</p></div>
    <div class="checkline">
      <span>last complete check <b>${fmtDay(data.lastCheck.at)} ${fmtTime(data.lastCheck.at)}</b></span>
      <span>scope <b>${esc(data.lastCheck.scope)}</b></span>
      <span class="tally"><span class="pass">${tally.pass} pass</span><span class="fail">${tally.fail} fail</span><span class="warn">${tally.warn} unknown</span></span>
      <form class="run" id="run-form"><label class="sr-only" for="run-scope">Scope</label><input id="run-scope" value="src, assets"><button class="btn primary" type="submit" id="run-btn">${ICON.play} Run checks</button></form>
    </div>
    <div class="board" role="table" aria-label="Gate results">
      <div class="hd" role="row"><span role="columnheader">Gate</span><span role="columnheader">Last run</span><span role="columnheader">Result</span><span></span></div>
      ${data.gates.map(g=>{ const [t,l]=gateState(g); const failing = g.run?.result==="fail"; return `
      <div class="brow" role="row" data-gate="${esc(g.id)}" id="gate-${esc(g.id)}">
        <div class="name" role="cell">${esc(g.name)}<span class="strength">${esc(g.strength)}</span><span class="how">${mechLabel(g)} · <code>${esc(g.ref)}</code> · ${esc(g.scope)}</span>${g.state==="draft"?`<small>draft · not eligible until accepted</small>`:""}</div>
        <div class="when" role="cell">${g.run?`${fmtDay(g.run.at)} ${fmtTime(g.run.at)}`:"never"}</div>
        <span class="state ${t}" role="cell">${esc(l)}</span>
        <button class="exp" type="button" aria-expanded="${failing?"true":"false"}" aria-controls="det-${esc(g.id)}" aria-label="Details for ${esc(g.name)}">${ICON.chev}</button>
      </div>
      <div class="bdetail ${failing?"open":""}" id="det-${esc(g.id)}"><div><div class="in">
        <div>
          <h4>${failing?"Failures":g.run?"Result":"Status"}</h4>
          ${failing?`<ul>${g.run.failures.map(f=>`<li><code>${esc(f[0])}</code><span>${esc(f[1])}</span></li>`).join("")}</ul>`
            : g.state==="draft"?`<p class="ok">A draft gate is not run. Accept it in the changelog, then it joins the next check.</p>`
            : !g.run?`<p class="ok">Never run. Unknown is reported as unknown.</p>`
            : g.run.fresh?`<p class="ok">Passed on the current revision. Receipt bound to the gate v${g.rev}, its scope and the checked snapshot.</p>`
            :`<p class="ok">Passed, but files in <code>${esc(g.scope)}</code> changed after this run. Rerun to make the result current.</p>`}
          <div class="tools"><code class="cmd">wh check --path ${esc(g.scope.split(",")[0].trim())}${g.mech==="ast"?" --rule "+esc(g.id):""}</code><button class="btn" type="button" data-copy="wh check --path ${esc(g.scope.split(",")[0].trim())}">${ICON.copy} Copy</button></div>
        </div>
        ${failing?`<div>
          <h4>Repair brief for the current worker</h4>
          <pre class="brief"><span class="k">gate</span>     ${esc(g.name)} (v${g.rev}, ${esc(g.strength)})
<span class="k">scope</span>    ${esc(g.scope)}
<span class="k">failures</span> ${g.run.failures.map(f=>f[0]).join(", ")}
<span class="k">repair</span>   within the current task; do not change or weaken the gate
<span class="k">recheck</span>  wh check --path ${esc(g.scope.split(",")[0].trim())}
<span class="k">stop</span>     if the fix needs a policy or boundary change, hand back to ${esc(data.agreement.owner)}</pre>
          <div class="tools"><span class="note">Hands the failure back. Starts no agent, grants no permission.</span><button class="btn" type="button" data-copy-brief="${esc(g.id)}">${ICON.copy} Copy brief</button></div>

    <details class="receipts"><summary>${ICON.chev}Receipts for the last check</summary><div class="rows">
      <div class="row"><div class="name">check receipt</div><code class="hash">sha256:3f43…1278</code><div class="meta">gates v1, v3, v1 · snapshot 2c3f0a3 · scope src, assets · ${fmtDay(data.lastCheck.at)} ${fmtTime(data.lastCheck.at)}</div></div>
      <div class="row"><div class="name">policy digest</div><code class="hash">sha256:d8f6…64d3</code><div class="meta">accepted revision 1 · private store</div></div>
    </div></details>`;
  el.querySelector("#run-form").addEventListener("submit",e=>{ e.preventDefault(); runChecks(); });
}
function runChecks(){
  const btn = $("run-btn"); btn.classList.add("busy"); btn.disabled = true;
  document.querySelectorAll(".brow").forEach(r=>{ if(!r.querySelector(".state").classList.contains("draft")){ r.classList.add("running"); const s=r.querySelector(".state"); s.className="state muted"; s.textContent="running"; }});
  announce("Running checks on the current revision.");
  setTimeout(()=>{
    const at = new Date(NOW.getTime()+11*60000).toISOString();
    for (const g of data.gates){ if (g.state==="draft") continue; g.run = g.run ? {...g.run, at, fresh:true} : { result:"pass", at, fresh:true }; }
    data.lastCheck = { at, scope: $("run-scope").value };
    renderAll(); announce("Check complete: results updated in place. Failures still need repair.");
    $("run-btn")?.focus();
  }, 900);
}

let clFilter = { q:"", asOf:"" };

        <div class="t">${esc(c.title)}<span class="ver">${esc(c.ver)}</span></div>
        <span class="state status ${c.status==="draft"?"draft":c.status}">${esc(c.status)}</span>

        <details><summary>${ICON.chev}Exact records</summary>
          ${c.before||c.after?`<div class="diff">${c.before?`<div class="before"><div class="lab">before</div><pre>${esc(JSON.stringify(c.before,null,2))}</pre></div>`:""}${c.after?`<div class="after"><div class="lab">after</div><pre>${esc(JSON.stringify(c.after,null,2))}</pre></div>`:""}</div>`:""}
          <pre>{ "id": "${esc(c.id)}", "recorded_at": "${esc(c.at)}", "status": "${esc(c.status)}", "owner": "${esc(c.owner)}", "visibility": "private" }</pre>
        </details>
      </article>`).join("")}</section>`).join("")
    : `<div class="panel"><div class="empty">No change matches “${esc(clFilter.q)}”. Clear the search or widen the as-of time.</div></div>`}`;
  $("cl-q").addEventListener("input",e=>{ clFilter.q=e.target.value; const pos=e.target.selectionStart; renderChangelog(); const i=$("cl-q"); i.focus(); i.setSelectionRange(pos,pos); });
  $("cl-asof").addEventListener("change",e=>{ clFilter.asOf=e.target.value; renderChangelog(); $("cl-asof").focus(); announce(clFilter.asOf?"Showing state as of the selected time.":"As-of cleared."); });
  $("cl-clear")?.addEventListener("click",()=>{ clFilter.asOf=""; renderChangelog(); $("cl-asof").focus(); });
}

/* ---------- shell ---------- */
const tabs = [...document.querySelectorAll('#rail [role="tab"]')];
function available(id){ return demo!=="fresh" || id==="tab-dashboard" || id==="tab-foundations"; }
function show(tab, focusId){
  if (tab.getAttribute("aria-disabled")==="true"){ announce("Available after foundations are established."); return; }
  for (const t of tabs){ const on=t===tab; t.setAttribute("aria-selected",on); t.tabIndex=on?0:-1; $(t.getAttribute("aria-controls")).hidden=!on; }
  tab.focus(); announce(`${tab.textContent.trim()} view`);
  if (focusId){ const target = $(focusId) || $("gate-"+focusId) || document.querySelector(`[data-rec="${CSS.escape(focusId)}"]`); if(target){ target.scrollIntoView({block:"start",behavior:"smooth"}); target.setAttribute("tabindex","-1"); target.focus({preventScroll:true}); } }
}
for (const t of tabs){
  t.addEventListener("click",()=>show(t));
  t.addEventListener("keydown",e=>{ const keys={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}; if(!(e.key in keys)&&e.key!=="Home"&&e.key!=="End") return; e.preventDefault(); let i=tabs.indexOf(t); i=e.key==="Home"?0:e.key==="End"?tabs.length-1:(i+keys[e.key]+tabs.length)%tabs.length; show(tabs[i]); });
}
document.addEventListener("click",e=>{
  const route = e.target.closest("[data-route]"); if(route){ show($("tab-"+route.dataset.route), route.dataset.focus); return; }
  const edit = e.target.closest("[data-edit]"); if(edit){ const host=document.querySelector(`[data-editor="${CSS.escape(edit.dataset.edit)}"]`); if(host.classList.contains("open")){ closeEditor(host); } else openEditor(edit.dataset.edit, edit); return; }
  const add = e.target.closest("[data-add]"); if(add){ announce(`In the product, Add ${add.dataset.add} opens the same editor with an empty base; the demo does not create records.`); return; }
  const exp = e.target.closest(".exp"); if(exp){ const d=$(exp.getAttribute("aria-controls")); const open=!d.classList.contains("open"); d.classList.toggle("open",open); exp.setAttribute("aria-expanded",open); return; }
  const cp = e.target.closest("[data-copy],[data-copy-brief]"); if(cp){ const text = cp.dataset.copy || document.querySelector(`#det-${CSS.escape(cp.dataset.copyBrief)} pre.brief`)?.textContent || ""; (navigator.clipboard?.writeText(text)||Promise.reject()).then(()=>{ const was=cp.innerHTML; cp.textContent="Copied"; setTimeout(()=>cp.innerHTML=was,1200); announce("Copied to clipboard."); }).catch(()=>announce("Clipboard unavailable; select the text to copy it.")); }
});
function renderAll(){
  $("project-name").textContent = data.project;
  $("agreement-state").textContent = demo==="fresh" ? "not initialised" : data.agreement.state; $("agreement-detail").textContent = demo==="fresh" ? "" : " · " + data.agreement.visibility;
  const dc = demo==="fresh" ? 0 : drafts(); $("draft-count").textContent = String(dc); $("draft-word").textContent = dc===1 ? "draft" : "drafts";
  for (const t of tabs){ const ok=available(t.id); t.setAttribute("aria-disabled", ok?"false":"true"); t.title = ok?"":"Available after foundations are established"; }
  renderDashboard(); renderFoundations(); renderChecks(); renderChangelog();
}
document.querySelectorAll('input[name="demo"]').forEach(r=>r.addEventListener("change",e=>{ demo=e.target.value; renderAll(); show($("tab-dashboard")); }));
$("demo-reset").addEventListener("click",()=>{ data=seed(); clFilter={q:"",asOf:""}; renderAll(); announce("Sample data reset."); });
renderAll();
</script>
