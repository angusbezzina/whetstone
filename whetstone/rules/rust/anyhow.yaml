source:
  name: anyhow
  docs_url: "https://docs.rs/anyhow"
  version: "1"
  content_hash: "sha256:dogfood-manual-extraction"
  resolved_at: "2026-04-05T00:00:00Z"
  registry: crates_io
  content_origin: readme

rules:
  # Bucket 3 (keep as AST): no linter expresses "prefer .context() over
  # map_err(|e| anyhow!(...))", and it is type-independent — a structural match
  # on a `map_err` call whose arguments contain the `anyhow!` macro. The regex
  # lives inside a `#match?` predicate bounded to the `arguments` node, not a
  # blind text sweep. See planning/skill-cli-boundary.md §3.
  - id: anyhow.context-over-map-err
    severity: should
    confidence: high
    category: convention
    description: >
      SHOULD use .context() or .with_context() instead of .map_err(|e| anyhow!(...))
      to add context to errors. The context methods are more idiomatic, compose better
      with the ? operator, and preserve the original error chain.
    source_url: "https://docs.rs/anyhow/latest/anyhow/trait.Context.html"
    approved: true
    status: approved
    signals:
      - id: map-err-anyhow-bang
        strategy: ast
        description: "A map_err call whose closure builds an error with the anyhow! macro"
        weight: required
        ast_query: |
          (call_expression
            function: (field_expression
              field: (field_identifier) @_method (#eq? @_method "map_err"))
            arguments: (arguments) @_args (#match? @_args "anyhow!")) @match

    golden_examples:
      - code: |
          let config = std::fs::read_to_string(path)
              .context("Failed to read config file")?;
        verdict: pass
        reason: "Uses .context() to add context idiomatically"
      - code: |
          let config = std::fs::read_to_string(path)
              .with_context(|| format!("Failed to read {}", path.display()))?;
        verdict: pass
        reason: "Uses .with_context() for dynamic context"
      - code: |
          let config = std::fs::read_to_string(path)
              .map_err(|e| anyhow!("Failed to read config: {}", e))?;
        verdict: fail
        reason: "Uses map_err+anyhow! instead of .context()"
      - code: |
          let n: i32 = text.parse().map_err(|e| ParseError::from(e))?;
        verdict: pass
        reason: "map_err without anyhow! is fine — this is not the targeted anti-pattern"

  # Bucket 1 (duplicates a linter): .unwrap() vs .expect() is exactly clippy's
  # `unwrap_used` restriction lint (off by default). Delegate via lint_proxy so
  # `wh actions lint` emits the Cargo `[lints.clippy]` enablement and CI enforces
  # it agent-free — rather than reimplementing it as a brittle regex.
  - id: anyhow.expect-over-unwrap
    severity: should
    confidence: high
    category: convention
    description: >
      SHOULD use .expect("reason") instead of .unwrap() in application code
      using anyhow. Enforced via clippy's `unwrap_used` restriction lint, which
      is off by default; Whetstone turns it on through generated Cargo lints.
    source_url: "https://rust-lang.github.io/rust-clippy/master/index.html#unwrap_used"
    approved: true
    status: approved
    signals:
      - id: unwrap-used
        strategy: lint_proxy
        description: "Covered by clippy::unwrap_used (restriction lint, off by default)"
        weight: required
        lint:
          tool: clippy
          code: unwrap_used

    golden_examples:
      - code: |
          let port = env::var("PORT").expect("PORT must be set");
        verdict: pass
        reason: "Documents why the value is expected to be present"
      - code: |
          let port = env::var("PORT").unwrap();
        verdict: fail
        reason: "Bare unwrap with no context for failure (clippy::unwrap_used)"
      - code: |
          let value = some_infallible_op().expect("internal: op is infallible");
        verdict: pass
        reason: "Documents the invariant even for infallible ops"
