# Whetstone required check, scaffolded by `wh init --action wire --ci`.
# The team owns this file. Make `whetstone/policy` a required status check on
# the default branch and protect this file with CODEOWNERS: a pull request that
# deletes or weakens it then needs the same review as any other rule change,
# and a required check that never reports blocks the merge.
#
# On a pull request, `whetstone/policy` runs `wh check --ci` for the pull
# request's commits against the committed rulebook, whetstone/rulebook.json:
# a must finding fails it, and each flag on a line the pull request touched
# is shown beside the code as an annotation (an error for a must rule, a
# warning for a should rule; `wh explain <rule>` says why it exists). On a
# push to main, the sweep runs the rules below must and uploads findings.json
# as the `scan-findings` artifact for whatever works the findings (an agent,
# a bot or a person).
name: whetstone

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    name: whetstone/policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned wh
        shell: bash
        env:
          WHETSTONE_VERSION: "__WHETSTONE_VERSION__"
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/angusbezzina/whetstone/v${WHETSTONE_VERSION}/install.sh" \
            | INSTALL_DIR="$RUNNER_TEMP/bin" sh -s -- --version "v${WHETSTONE_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: whetstone/policy
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          wh check --ci --base "$BASE_REF" --format annotations

  sweep:
    name: whetstone/sweep
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned wh
        shell: bash
        env:
          WHETSTONE_VERSION: "__WHETSTONE_VERSION__"
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/angusbezzina/whetstone/v${WHETSTONE_VERSION}/install.sh" \
            | INSTALL_DIR="$RUNNER_TEMP/bin" sh -s -- --version "v${WHETSTONE_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: wh check --sweep
        shell: bash
        run: |
          set -euo pipefail
          wh check --sweep > findings.json
      - uses: actions/upload-artifact@v4
        with:
          name: scan-findings
          path: findings.json

  # Work the sweep's findings by class with the Whetstone runner: a draft pull
  # request per draft_pr finding, an issue to approve per confirm_first, an
  # issue to discuss per discuss, idempotent by fingerprint. Off until the
  # repository variable WHETSTONE_WORK is set to "on".
  work:
    name: whetstone/work
    needs: sweep
    if: github.event_name == 'push' && vars.WHETSTONE_WORK == 'on'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned wh
        shell: bash
        env:
          WHETSTONE_VERSION: "__WHETSTONE_VERSION__"
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/angusbezzina/whetstone/v${WHETSTONE_VERSION}/install.sh" \
            | INSTALL_DIR="$RUNNER_TEMP/bin" sh -s -- --version "v${WHETSTONE_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: scan-findings
      - name: Open work by class
        uses: angusbezzina/whetstone@v__WHETSTONE_VERSION__
        with:
          findings: findings.json
