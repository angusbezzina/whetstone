name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: macos-14
            target: x86_64-apple-darwin
            cross: false
          - os: macos-14
            target: aarch64-apple-darwin
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install pinned cross
        if: matrix.cross
        run: cargo install cross --locked --version 0.2.5

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cross }}" = true ]; then
            cross build --release --target "${{ matrix.target }}"
          else
            cargo build --release --target "${{ matrix.target }}"
          fi
          cp "target/${{ matrix.target }}/release/whetstone" \
            "whetstone-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: whetstone-${{ matrix.target }}
          path: whetstone-${{ matrix.target }}

  validate-linux-binary:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: whetstone-x86_64-unknown-linux-gnu

      - name: Prove honest, non-vacuous foundation
        shell: bash
        run: |
          set -euo pipefail
          bin=./whetstone-x86_64-unknown-linux-gnu
          chmod +x "$bin"
          "$bin" --version | grep -q '^whetstone '
          "$bin" --json | jq -e '.status == "foundation" and .available == []' >/dev/null
          "$bin" validate
          eval_result=$("$bin" eval --json)
          echo "$eval_result" | jq -e \
            '.ok and .rules_evaluated > 0 and ([.scorecards[].golden_checked] | add) > 0' \
            >/dev/null
          scan_result=$("$bin" scan src --lang rust --json --no-fail)
          echo "$scan_result" | jq -e \
            '.violations_count == 0 and .config_issues_count == 0 and .files_scanned > 0 and .rules_applied > 0' \
            >/dev/null
          if "$bin" status >/dev/null 2>&1; then
            echo 'retired command unexpectedly executed' >&2
            exit 1
          fi

  publish:
    needs: [build, validate-linux-binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          find artifacts -type f -name 'whetstone-*' -exec cp {} release/ \;
          cd release
          sha256sum whetstone-* > checksums-sha256.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/whetstone-*
            release/checksums-sha256.txt
