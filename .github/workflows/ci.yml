name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python quality tools
        run: python3 -m pip install pytest ruff

      # The verification driver needs Node 22 (global WebSocket and fetch).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Beads (bd) 1.1.2
        shell: bash
        env:
          BD_VERSION: "1.1.2"
          # Digest published in the official v1.1.2 release checksums.txt.
          BD_ARCHIVE_SHA256: a72d71ed374955dc9f83a0f90b54bd7b6a0016709dd1676ae2e368651ed401c2
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/beads_linux_amd64.tar.gz"
          curl -fsSL \
            -o "$archive" \
            "https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}/beads_${BD_VERSION}_linux_amd64.tar.gz"
          echo "$BD_ARCHIVE_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bd"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bd"
          "$RUNNER_TEMP/bd/bd" version | grep -q "${BD_VERSION}"
          echo "$RUNNER_TEMP/bd" >> "$GITHUB_PATH"
          git config --global user.name "Whetstone CI"
          git config --global user.email "ci@whetstone.invalid"

      - name: 1 - Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: 2 - Rust tests
        run: cargo test

      - name: 3 - Ruff lint
        run: python3 -m ruff check scripts/ tests/ --select E,F,W,I --ignore E501

      - name: 4 - Ruff format
        run: python3 -m ruff format --check scripts/ tests/

      - name: 5 - Rule validation
        run: cargo run --quiet --release -- validate

      - name: 6 - Scanner-backed golden evaluation
        shell: bash
        run: |
          set -euo pipefail
          result=$(cargo run --quiet --release -- eval --json)
          echo "$result" | jq -e '
            .ok == true and
            .rules_evaluated > 0 and
            ([.scorecards[].golden_checked] | add) > 0 and
            .golden_mismatch_count == 0 and
            .source_fidelity_failure_count == 0
          ' >/dev/null

      - name: 7 - Non-vacuous self scan
        shell: bash
        run: |
          set -euo pipefail
          result=$(cargo run --quiet --release -- scan src --lang rust --json --no-fail)
          echo "$result" | jq -e '
            .violations_count == 0 and
            .config_issues_count == 0 and
            .files_scanned > 0 and
            .rules_applied > 0
          ' >/dev/null

      - name: 8 - Python black-box tests
        run: python3 -m pytest -q

  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Install one binary with wh alias
        shell: bash
        run: |
          set -euo pipefail
          root=$(mktemp -d)
          INSTALL_DIR="$root/bin" \
          WHETSTONE_INSTALL_LOCAL_SRC="$PWD/target/release/whetstone" \
            ./install.sh
          test -x "$root/bin/whetstone"
          test -L "$root/bin/wh"
          test "$(readlink "$root/bin/wh")" = "$root/bin/whetstone"
          "$root/bin/wh" --version | grep -q '^whetstone '
          orientation=$("$root/bin/wh" --json)
          echo "$orientation" | jq -e '
            .schema == "whetstone.command-response.v1" and
            .schema_version == 1 and
            .state == "success" and
            .workflow == "orientation" and
            .data.read_only == true and
            .data.workflows == ["init", "dash", "change", "check", "pull", "push"] and
            .permitted_actions == ["wh init", "wh dash", "wh change", "wh check", "wh pull", "wh push"]
          ' >/dev/null
          if "$root/bin/wh" status >/dev/null 2>&1; then
            echo 'retired command unexpectedly executed' >&2
            exit 1
          fi
