name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Configure Git for the tests' throwaway commits
        run: |
          git config --global user.name "Whetstone CI"
          git config --global user.email "ci@whetstone.invalid"

      - name: 1 - Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.132

      - name: 2 - Rust tests
        run: |
          cargo nextest run --no-fail-fast
          cargo test --doc

      - name: 3 - Self-check against Whetstone's own must rules
        shell: bash
        run: |
          set -euo pipefail
          cargo build --quiet
          scripts/self-check.sh target/debug/whetstone

  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Install one binary with wh alias
        shell: bash
        run: |
          set -euo pipefail
          root=$(mktemp -d)
          INSTALL_DIR="$root/bin" \
          WHETSTONE_INSTALL_LOCAL_SRC="$PWD/target/release/whetstone" \
            ./install.sh
          test -x "$root/bin/whetstone"
          test -L "$root/bin/wh"
          test "$(readlink "$root/bin/wh")" = "$root/bin/whetstone"
          "$root/bin/wh" --version | grep -q '^whetstone '
          orientation=$("$root/bin/wh" --json)
          echo "$orientation" | jq -e '
            .schema == "whetstone.command-response.v1" and
            .schema_version == 1 and
            .state == "success" and
            .workflow == "orientation" and
            .data.read_only == true and
            .data.workflows == ["init", "dash", "change", "check"] and
            .permitted_actions == ["wh init", "wh dash", "wh change", "wh check"]
          ' >/dev/null
          if "$root/bin/wh" status >/dev/null 2>&1; then
            echo 'retired command unexpectedly executed' >&2
            exit 1
          fi
